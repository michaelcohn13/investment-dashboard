    <script>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function Dashboard() {
            const [investments, setInvestments] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [lastUpdate, setLastUpdate] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [statusFilter, setStatusFilter] = useState('All');
            const [holdPeriodFilter, setHoldPeriodFilter] = useState('All');

            useEffect(() => {
                loadDataFromGoogleSheets();
                const interval = setInterval(loadDataFromGoogleSheets, 30000);
                return () => clearInterval(interval);
            }, []);

            const loadDataFromGoogleSheets = async () => {
                try {
                    const response = await fetch(SHEET_URL);
                    const text = await response.text();
                    const json = JSON.parse(text.substring(47).slice(0, -2));
                    const rows = json.table.rows;
                    const investments = [];
                    
                    for (let i = 4; i < rows.length; i++) {
                        const row = rows[i];
                        if (!row.c || !row.c[1] || !row.c[1].v) continue;
                        
                        const company = row.c[1]?.v;
                        if (!company || company.includes('Total') || company.includes('Capital') || company.includes('Residual')) continue;
                        
                        // Validate the data
                        const investment = {
                            company: company,
                            status: row.c[2]?.v || 'Unknown',
                            where_held: row.c[3]?.v || '',
                            amount_invested: parseFloat(row.c[4]?.v) || 0,
                            initial_date: row.c[6]?.f || '',
                            shares: parseFloat(row.c[7]?.v) || null,
                            pps: parseFloat(row.c[8]?.v) || null,
                            exit_date: row.c[9]?.f || '',
                            realized_proceeds: parseFloat(row.c[10]?.v) || 0,
                            coc_return: parseFloat(row.c[11]?.v) || 0,
                            fmv_today: parseFloat(row.c[12]?.v) || 0,
                            gain_loss: parseFloat(row.c[13]?.v) || 0,
                            multiple: parseFloat(row.c[14]?.v) || 0,
                        };
                        
                        // Validate required fields
                        if (investment.company && investment.amount_invested >= 0) {
                            investments.push(investment);
                        } else {
                            console.warn('Skipping invalid row:', investment);
                        }
                    }
                    
                    if (investments.length === 0) {
                        throw new Error('No valid investments found in sheet');
                    }
                    
                    setInvestments(investments);
                    setLastUpdate(new Date());
                    setLoading(false);
                    setError(null);
                } catch (err) {
                    console.error('Error loading data:', err);
                    
                    // More helpful error messages
                    let errorMessage = 'Unable to load data from Google Sheets. ';
                    if (err.message.includes('Failed to fetch')) {
                        errorMessage += 'Please check your internet connection.';
                    } else if (err.message.includes('No valid investments')) {
                        errorMessage += 'The sheet appears to be empty or incorrectly formatted.';
                    } else {
                        errorMessage += 'Please make sure the sheet is publicly accessible.';
                    }
                    
                    setError(errorMessage);
                    setLoading(false);
                }
            };

            const calculateHoldPeriod = (initialDate, exitDate, status) => {
                if (!initialDate) return { years: 0, category: 'Unknown', label: '—' };
                
                const startDate = new Date(initialDate);
                const endDate = exitDate && status !== 'Active' ? new Date(exitDate) : new Date('2026-01-31');
                
                const diffTime = Math.abs(endDate - startDate);
                const diffYears = diffTime / (1000 * 60 * 60 * 24 * 365.25);
                
                let category, label;
                if (diffYears < 1) {
                    category = '< 1 year';
                    label = `${Math.floor(diffYears * 12)}mo`;
                } else if (diffYears < 2) {
                    category = '1-2 years';
                    label = `${diffYears.toFixed(1)}y`;
                } else if (diffYears < 5) {
                    category = '3-5 years';
                    label = `${diffYears.toFixed(1)}y`;
                } else if (diffYears < 10) {
                    category = '5-10 years';
                    label = `${diffYears.toFixed(1)}y`;
                } else {
                    category = '10+ years';
                    label = `${diffYears.toFixed(1)}y`;
                }
                
                return { years: diffYears, category, label };
            };

            const stats = useMemo(() => {
                if (investments.length === 0) return {};
                
                const active = investments.filter(inv => inv.status === 'Active');
                const exited = investments.filter(inv => inv.status === 'Exited');
                const wroteOff = investments.filter(inv => inv.status === 'Wrote-Off');
                
                const totalInvested = investments.reduce((sum, inv) => sum + inv.amount_invested, 0);
                const currentValue = investments.reduce((sum, inv) => sum + inv.fmv_today, 0);
                const totalRealized = investments.reduce((sum, inv) => sum + inv.realized_proceeds, 0);
                const totalGainLoss = investments.reduce((sum, inv) => sum + inv.gain_loss, 0);
                const activeInvested = active.reduce((sum, inv) => sum + inv.amount_invested, 0);
                
                const holdPeriodCounts = {
                    '< 1 year': 0,
                    '1-2 years': 0,
                    '3-5 years': 0,
                    '5-10 years': 0,
                    '10+ years': 0
                };
                
                investments.forEach(inv => {
                    const hp = calculateHoldPeriod(inv.initial_date, inv.exit_date, inv.status);
                    if (holdPeriodCounts.hasOwnProperty(hp.category)) {
                        holdPeriodCounts[hp.category]++;
                    }
                });
                
                return {
                    totalInvested,
                    currentValue,
                    totalRealized,
                    totalGainLoss,
                    activeInvested,
                    totalCompanies: investments.length,
                    activeCount: active.length,
                    exitedCount: exited.length,
                    wroteOffCount: wroteOff.length,
                    avgMultiple: totalInvested > 0 ? ((currentValue + totalRealized) / totalInvested).toFixed(2) : '0.00',
                    holdPeriodCounts
                };
            }, [investments]);

            // Dynamic counts for status filters based on current hold period filter
            const statusCounts = useMemo(() => {
                let filtered = investments;
                
                // Apply hold period filter if active
                if (holdPeriodFilter !== 'All') {
                    filtered = filtered.filter(inv => {
                        const hp = calculateHoldPeriod(inv.initial_date, inv.exit_date, inv.status);
                        return hp.category === holdPeriodFilter;
                    });
                }
                
                // Apply search if active
                if (searchTerm) {
                    filtered = filtered.filter(inv =>
                        inv.company.toLowerCase().includes(searchTerm.toLowerCase())
                    );
                }
                
                return {
                    all: filtered.length,
                    active: filtered.filter(inv => inv.status === 'Active').length,
                    exited: filtered.filter(inv => inv.status === 'Exited').length,
                    wroteOff: filtered.filter(inv => inv.status === 'Wrote-Off').length
                };
            }, [investments, holdPeriodFilter, searchTerm]);

            // Dynamic counts for hold period filters based on current status filter
            const holdPeriodCounts = useMemo(() => {
                let filtered = investments;
                
                // Apply status filter if active
                if (statusFilter !== 'All') {
                    filtered = filtered.filter(inv => inv.status === statusFilter);
                }
                
                // Apply search if active
                if (searchTerm) {
                    filtered = filtered.filter(inv =>
                        inv.company.toLowerCase().includes(searchTerm.toLowerCase())
                    );
                }
                
                const counts = {
                    '< 1 year': 0,
                    '1-2 years': 0,
                    '3-5 years': 0,
                    '5-10 years': 0,
                    '10+ years': 0
                };
                
                filtered.forEach(inv => {
                    const hp = calculateHoldPeriod(inv.initial_date, inv.exit_date, inv.status);
                    if (counts.hasOwnProperty(hp.category)) {
                        counts[hp.category]++;
                    }
                });
                
                return counts;
            }, [investments, statusFilter, searchTerm]);

            const filteredInvestments = useMemo(() => {
                let filtered = investments;

                if (statusFilter !== 'All') {
                    filtered = filtered.filter(inv => inv.status === statusFilter);
                }

                if (holdPeriodFilter !== 'All') {
                    filtered = filtered.filter(inv => {
                        const hp = calculateHoldPeriod(inv.initial_date, inv.exit_date, inv.status);
                        return hp.category === holdPeriodFilter;
                    });
                }

                if (searchTerm) {
                    filtered = filtered.filter(inv =>
                        inv.company.toLowerCase().includes(searchTerm.toLowerCase())
                    );
                }

                filtered.sort((a, b) => {
                    const statusOrder = { 'Active': 1, 'Exited': 2, 'Wrote-Off': 3 };
                    const statusCompare = (statusOrder[a.status] || 99) - (statusOrder[b.status] || 99);
                    if (statusCompare !== 0) return statusCompare;
                    return a.company.localeCompare(b.company);
                });

                return filtered;
            }, [investments, searchTerm, statusFilter, holdPeriodFilter]);

            // Calculate stats for the current filtered view
            const filteredStats = useMemo(() => {
                if (filteredInvestments.length === 0) {
                    return {
                        totalInvested: 0,
                        currentValue: 0,
                        totalRealized: 0,
                        totalGainLoss: 0,
                        activeInvested: 0,
                        activeCount: 0,
                        exitedCount: 0,
                        avgMultiple: '0.00'
                    };
                }
                
                const active = filteredInvestments.filter(inv => inv.status === 'Active');
                const exited = filteredInvestments.filter(inv => inv.status === 'Exited');
                
                const totalInvested = filteredInvestments.reduce((sum, inv) => sum + inv.amount_invested, 0);
                const currentValue = filteredInvestments.reduce((sum, inv) => sum + inv.fmv_today, 0);
                const totalRealized = filteredInvestments.reduce((sum, inv) => sum + inv.realized_proceeds, 0);
                const totalGainLoss = filteredInvestments.reduce((sum, inv) => sum + inv.gain_loss, 0);
                const activeInvested = active.reduce((sum, inv) => sum + inv.amount_invested, 0);
                
                return {
                    totalInvested,
                    currentValue,
                    totalRealized,
                    totalGainLoss,
                    activeInvested,
                    activeCount: active.length,
                    exitedCount: exited.length,
                    avgMultiple: totalInvested > 0 ? ((currentValue + totalRealized) / totalInvested).toFixed(2) : '0.00'
                };
            }, [filteredInvestments]);

            // Use filtered stats if any filters are active, otherwise use full stats
            const displayStats = (searchTerm || statusFilter !== 'All' || holdPeriodFilter !== 'All') 
                ? filteredStats 
                : stats;

            const formatCurrency = (amount) => {
                return new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: 'USD',
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 0
                }).format(amount || 0);
            };

            const formatDate = (date) => {
                if (!date) return '—';
                return new Date(date).toLocaleDateString('en-US', { year: 'numeric', month: 'short' });
            };

            const exportToCSV = () => {
                // Prepare CSV headers
                const headers = ['Company', 'Status', 'Date of Investment', 'Hold Period', 'Amount Invested', 'Current Value', 'Realized Proceeds', 'Gain/Loss', 'Multiple'];
                
                // Prepare CSV rows
                const rows = filteredInvestments.map(inv => {
                    const holdPeriod = calculateHoldPeriod(inv.initial_date, inv.exit_date, inv.status);
                    const showHoldPeriod = inv.status !== 'Exited' || inv.exit_date ? holdPeriod.category : '';
                    
                    return [
                        `"${inv.company}"`,
                        inv.status,
                        inv.initial_date || '',
                        showHoldPeriod,
                        inv.amount_invested || 0,
                        inv.fmv_today || 0,
                        inv.realized_proceeds || 0,
                        inv.gain_loss || 0,
                        inv.multiple ? inv.multiple.toFixed(1) : ''
                    ];
                });
                
                // Combine headers and rows
                const csvContent = [
                    headers.join(','),
                    ...rows.map(row => row.join(','))
                ].join('\n');
                
                // Create download
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                const url = URL.createObjectURL(blob);
                
                const statusPart = statusFilter !== 'All' ? `_${statusFilter}` : '';
                const periodPart = holdPeriodFilter !== 'All' ? `_${holdPeriodFilter.replace(/[<>]/g, '').replace(/\s+/g, '-')}` : '';
                const filename = `Quazzo_Portfolio${statusPart}${periodPart}_${new Date().toISOString().split('T')[0]}.csv`;
                
                link.setAttribute('href', url);
                link.setAttribute('download', filename);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const exportToPDF = () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({
                    orientation: 'landscape',
                    unit: 'pt',
                    format: 'letter'
                });

                // Header with branding
                doc.setFillColor(91, 79, 255);
                doc.rect(0, 0, 792, 60, 'F');
                
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(18);
                doc.setFont(undefined, 'bold');
                doc.text('Deborah Quazzo Angel Investment Portfolio', 40, 35);
                
                // Subtitle with filter info
                doc.setTextColor(0, 0, 0);
                doc.setFontSize(11);
                doc.setFont(undefined, 'normal');
                const filterText = statusFilter !== 'All' ? `Filtered by: ${statusFilter}` : 'All Investments';
                const periodText = holdPeriodFilter !== 'All' ? ` • ${holdPeriodFilter}` : '';
                doc.text(`${filterText}${periodText}`, 40, 80);
                
                doc.setFontSize(10);
                doc.setTextColor(100, 100, 100);
                doc.text(`Generated: ${new Date().toLocaleDateString()} • Showing ${filteredInvestments.length} of ${stats.totalCompanies} investments`, 40, 95);

                // Prepare table data
                const tableData = filteredInvestments.map(inv => {
                    const holdPeriod = calculateHoldPeriod(inv.initial_date, inv.exit_date, inv.status);
                    const showHoldPeriod = inv.status !== 'Exited' || inv.exit_date ? holdPeriod.category : '—';
                    
                    return [
                        inv.company,
                        inv.status,
                        formatDate(inv.initial_date),
                        showHoldPeriod,
                        formatCurrency(inv.amount_invested),
                        formatCurrency(inv.fmv_today),
                        formatCurrency(inv.realized_proceeds),
                        formatCurrency(inv.gain_loss),
                        inv.multiple ? inv.multiple.toFixed(1) + 'x' : '—'
                    ];
                });

                // Generate table with improved formatting
                doc.autoTable({
                    head: [['Company', 'Status', 'Date', 'Hold Period', 'Invested', 'Current Value', 'Realized', 'Gain/Loss', 'Multiple']],
                    body: tableData,
                    startY: 110,
                    styles: {
                        fontSize: 10,
                        cellPadding: 5,
                        overflow: 'linebreak',
                        lineColor: [233, 231, 255],
                        lineWidth: 0.5
                    },
                    headStyles: {
                        fillColor: [91, 79, 255],
                        textColor: 255,
                        fontSize: 10,
                        fontStyle: 'bold',
                        halign: 'left',
                        cellPadding: 6
                    },
                    columnStyles: {
                        0: { cellWidth: 95, fontStyle: 'bold' },  // Company - bold
                        1: { cellWidth: 55 },  // Status
                        2: { cellWidth: 60 },  // Date
                        3: { cellWidth: 70 },  // Hold Period
                        4: { cellWidth: 75, halign: 'right' },  // Invested
                        5: { cellWidth: 75, halign: 'right' },  // Current Value
                        6: { cellWidth: 75, halign: 'right' },  // Realized
                        7: { cellWidth: 75, halign: 'right' },  // Gain/Loss
                        8: { cellWidth: 50, halign: 'right', fontStyle: 'bold' }   // Multiple - bold
                    },
                    alternateRowStyles: {
                        fillColor: [250, 250, 255]
                    },
                    margin: { top: 110, left: 40, right: 40, bottom: 60 },
                    didDrawPage: (data) => {
                        // Page numbers
                        doc.setFontSize(9);
                        doc.setTextColor(150, 150, 150);
                        doc.text(
                            `Page ${doc.internal.getCurrentPageInfo().pageNumber}`,
                            data.settings.margin.left,
                            doc.internal.pageSize.height - 30
                        );
                        
                        // Confidential watermark
                        doc.setTextColor(200, 200, 200);
                        doc.text('CONFIDENTIAL', doc.internal.pageSize.width - 100, doc.internal.pageSize.height - 30);
                    }
                });

                // Summary footer on last page
                const finalY = doc.lastAutoTable.finalY + 25;
                if (finalY < doc.internal.pageSize.height - 80) {
                    doc.setDrawColor(91, 79, 255);
                    doc.setLineWidth(2);
                    doc.line(40, finalY, 752, finalY);
                    
                    doc.setFontSize(11);
                    doc.setFont(undefined, 'bold');
                    doc.setTextColor(0, 0, 0);
                    doc.text('Portfolio Summary', 40, finalY + 20);
                    
                    doc.setFontSize(10);
                    doc.setFont(undefined, 'normal');
                    const summaryY = finalY + 40;
                    doc.text(`Companies: ${filteredInvestments.length}`, 40, summaryY);
                    doc.text(`Total Invested: ${formatCurrency(displayStats.totalInvested)}`, 200, summaryY);
                    doc.text(`Current Value: ${formatCurrency(displayStats.currentValue)}`, 380, summaryY);
                    doc.text(`Total Gain/Loss: ${formatCurrency(displayStats.totalGainLoss)}`, 560, summaryY);
                }

                // Save with descriptive filename
                const statusPart = statusFilter !== 'All' ? `_${statusFilter}` : '';
                const periodPart = holdPeriodFilter !== 'All' ? `_${holdPeriodFilter.replace(/[<>]/g, '').replace(/\s+/g, '-')}` : '';
                const filename = `Quazzo_Portfolio${statusPart}${periodPart}_${new Date().toISOString().split('T')[0]}.pdf`;
                
                doc.save(filename);
            };

            const exportToCSV = () => {
                // Prepare CSV data
                const headers = ['Company', 'Status', 'Date of Investment', 'Hold Period', 'Amount Invested', 'Current Value', 'Realized Proceeds', 'Gain/Loss', 'Multiple'];
                
                const rows = filteredInvestments.map(inv => {
                    const holdPeriod = calculateHoldPeriod(inv.initial_date, inv.exit_date, inv.status);
                    const showHoldPeriod = inv.status !== 'Exited' || inv.exit_date ? holdPeriod.category : '';
                    
                    return [
                        inv.company,
                        inv.status,
                        inv.initial_date || '',
                        showHoldPeriod,
                        inv.amount_invested || 0,
                        inv.fmv_today || 0,
                        inv.realized_proceeds || 0,
                        inv.gain_loss || 0,
                        inv.multiple ? inv.multiple.toFixed(1) : ''
                    ];
                });

                // Convert to CSV format
                const csvContent = [
                    headers.join(','),
                    ...rows.map(row => row.map(cell => {
                        // Escape cells with commas or quotes
                        const cellStr = String(cell);
                        if (cellStr.includes(',') || cellStr.includes('"') || cellStr.includes('\n')) {
                            return `"${cellStr.replace(/"/g, '""')}"`;
                        }
                        return cellStr;
                    }).join(','))
                ].join('\n');

                // Create download
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                const url = URL.createObjectURL(blob);
                
                const statusPart = statusFilter !== 'All' ? `_${statusFilter}` : '';
                const periodPart = holdPeriodFilter !== 'All' ? `_${holdPeriodFilter.replace(/[<>]/g, '').replace(/\s+/g, '-')}` : '';
                const filename = `Quazzo_Portfolio${statusPart}${periodPart}_${new Date().toISOString().split('T')[0]}.csv`;
                
                link.setAttribute('href', url);
                link.setAttribute('download', filename);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            if (loading) {
                return (
                    <div className="loading">
                        <div style={{
                            width: '48px',
                            height: '48px',
                            border: '4px solid var(--color-border)',
                            borderTop: '4px solid var(--color-primary)',
                            borderRadius: '50%',
                            animation: 'spin 1s linear infinite',
                            margin: '0 auto 1rem'
                        }}></div>
                        <div style={{fontSize: '1.125rem', fontWeight: '600'}}>Loading portfolio data from Google Sheets...</div>
                        <div style={{marginTop: '0.5rem', color: 'var(--color-text-light)', fontSize: '0.875rem'}}>
                            This usually takes just a few seconds
                        </div>
                    </div>
                );
            }

            if (error) {
                return <div className="error">⚠️ {error}</div>;
            }

            return (
                <div className="app">
                    <div className="header">
                        <div className="header-content">
                            <div className="live-badge">
                                <span className="live-dot"></span>
                                LIVE - Auto-updates from Google Sheets
                            </div>
                            <h1>Deborah Quazzo Angel Investment Summary</h1>
                            <div className="subtitle">
                                Complete Portfolio • As of January 31, 2026 • {stats.totalCompanies} Investments
                                {lastUpdate && ` • Last updated: ${lastUpdate.toLocaleTimeString()}`}
                            </div>
                        </div>
                    </div>

                    <div className="stats-overview">
                        <div className="stats-grid">
                            <div className="stat-card">
                                <span className="stat-icon">💰</span>
                                <div className="stat-label">Total Invested</div>
                                <div className="stat-value">{formatCurrency(displayStats.totalInvested)}</div>
                                <div className="stat-change">
                                    {(searchTerm || statusFilter !== 'All' || holdPeriodFilter !== 'All') 
                                        ? `${filteredInvestments.length} companies (filtered)`
                                        : `${stats.totalCompanies} companies`
                                    }
                                </div>
                            </div>
                            <div className="stat-card">
                                <span className="stat-icon">🎉</span>
                                <div className="stat-label">Realized Proceeds</div>
                                <div className="stat-value">{formatCurrency(displayStats.totalRealized)}</div>
                                <div className="stat-change">
                                    {(searchTerm || statusFilter !== 'All' || holdPeriodFilter !== 'All') 
                                        ? 'From filtered view'
                                        : 'Cash returned'
                                    }
                                </div>
                            </div>
                            <div className="stat-card">
                                <span className="stat-icon">📈</span>
                                <div className="stat-label">Residual Value</div>
                                <div className="stat-value">{formatCurrency(displayStats.currentValue)}</div>
                                <div className="stat-change-small">Original: {formatCurrency(displayStats.activeInvested)} invested</div>
                            </div>
                            <div className="stat-card">
                                <span className="stat-icon">✨</span>
                                <div className="stat-label">Total Gain/Loss</div>
                                <div className="stat-value">{formatCurrency(displayStats.totalGainLoss)}</div>
                                <div className="stat-change">{displayStats.avgMultiple}x TVPI</div>
                            </div>
                            <div className="stat-card">
                                <span className="stat-icon">📊</span>
                                <div className="stat-label">Active Holdings</div>
                                <div className="stat-value">{displayStats.activeCount}</div>
                                <div className="stat-change">
                                    {(searchTerm || statusFilter !== 'All' || holdPeriodFilter !== 'All') 
                                        ? 'In filtered view'
                                        : 'Current investments'
                                    }
                                </div>
                            </div>
                            <div className="stat-card">
                                <span className="stat-icon">🚪</span>
                                <div className="stat-label">Exits</div>
                                <div className="stat-value">{displayStats.exitedCount}</div>
                                <div className="stat-change">
                                    {(searchTerm || statusFilter !== 'All' || holdPeriodFilter !== 'All') 
                                        ? 'In filtered view'
                                        : 'Successful exits'
                                    }
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="main-content">
                        <div className="filters">
                            <div className="search-box">
                                <span className="search-icon">🔍</span>
                                <input
                                    type="text"
                                    className="search-input"
                                    placeholder="Search companies..."
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                />
                            </div>
                            <button
                                className={`filter-btn ${statusFilter === 'All' ? 'active' : ''}`}
                                onClick={() => setStatusFilter('All')}
                            >
                                All ({statusCounts.all})
                            </button>
                            <button
                                className={`filter-btn ${statusFilter === 'Active' ? 'active' : ''}`}
                                onClick={() => setStatusFilter('Active')}
                            >
                                Active ({statusCounts.active})
                            </button>
                            <button
                                className={`filter-btn ${statusFilter === 'Exited' ? 'active' : ''}`}
                                onClick={() => setStatusFilter('Exited')}
                            >
                                Exited ({statusCounts.exited})
                            </button>
                            <button
                                className={`filter-btn ${statusFilter === 'Wrote-Off' ? 'active' : ''}`}
                                onClick={() => setStatusFilter('Wrote-Off')}
                            >
                                Written Off ({statusCounts.wroteOff})
                            </button>
                            <button
                                className="pdf-btn"
                                onClick={exportToCSV}
                                style={{background: '#10B981'}}
                            >
                                📊 Download CSV
                            </button>
                            <button
                                className="pdf-btn"
                                onClick={exportToPDF}
                            >
                                📄 Download PDF
                            </button>
                            <button
                                className="pdf-btn"
                                onClick={exportToCSV}
                            >
                                📊 Download CSV
                            </button>
                            {(searchTerm || statusFilter !== 'All' || holdPeriodFilter !== 'All') && (
                                <button
                                    className="filter-btn"
                                    onClick={() => {
                                        setSearchTerm('');
                                        setStatusFilter('All');
                                        setHoldPeriodFilter('All');
                                    }}
                                    style={{
                                        marginLeft: 'auto',
                                        background: 'rgba(239, 68, 68, 0.1)',
                                        color: '#EF4444',
                                        border: '2px solid #EF4444'
                                    }}
                                >
                                    ✕ Clear All Filters
                                </button>
                            )}
                        </div>

                        <div style={{
                            textAlign: 'center',
                            padding: '0.75rem',
                            color: 'var(--color-text-light)',
                            fontSize: '0.9375rem',
                            fontWeight: '500'
                        }}>
                            Showing {filteredInvestments.length} of {stats.totalCompanies} investments
                            {(searchTerm || statusFilter !== 'All' || holdPeriodFilter !== 'All') && (
                                <span style={{
                                    marginLeft: '0.5rem',
                                    padding: '0.25rem 0.75rem',
                                    background: 'var(--gradient-primary)',
                                    color: 'white',
                                    borderRadius: '12px',
                                    fontSize: '0.8125rem',
                                    fontWeight: '700'
                                }}>
                                    {[
                                        searchTerm && 'Search',
                                        statusFilter !== 'All' && statusFilter,
                                        holdPeriodFilter !== 'All' && holdPeriodFilter
                                    ].filter(Boolean).length} filter{[
                                        searchTerm && 'Search',
                                        statusFilter !== 'All' && statusFilter,
                                        holdPeriodFilter !== 'All' && holdPeriodFilter
                                    ].filter(Boolean).length !== 1 ? 's' : ''} active
                                </span>
                            )}
                        </div>

                        <div className="filters" style={{marginTop: '1rem'}}>
                            <div style={{fontWeight: 600, color: 'var(--color-text)', minWidth: '120px'}}>
                                Hold Period:
                            </div>
                            <button
                                className={`filter-btn ${holdPeriodFilter === 'All' ? 'active' : ''}`}
                                onClick={() => setHoldPeriodFilter('All')}
                            >
                                All Periods
                            </button>
                            <button
                                className={`filter-btn ${holdPeriodFilter === '< 1 year' ? 'active' : ''}`}
                                onClick={() => setHoldPeriodFilter('< 1 year')}
                            >
                                &lt; 1 Year ({holdPeriodCounts['< 1 year']})
                            </button>
                            <button
                                className={`filter-btn ${holdPeriodFilter === '1-2 years' ? 'active' : ''}`}
                                onClick={() => setHoldPeriodFilter('1-2 years')}
                            >
                                1-2 Years ({holdPeriodCounts['1-2 years']})
                            </button>
                            <button
                                className={`filter-btn ${holdPeriodFilter === '3-5 years' ? 'active' : ''}`}
                                onClick={() => setHoldPeriodFilter('3-5 years')}
                            >
                                3-5 Years ({holdPeriodCounts['3-5 years']})
                            </button>
                            <button
                                className={`filter-btn ${holdPeriodFilter === '5-10 years' ? 'active' : ''}`}
                                onClick={() => setHoldPeriodFilter('5-10 years')}
                            >
                                5-10 Years ({holdPeriodCounts['5-10 years']})
                            </button>
                            <button
                                className={`filter-btn ${holdPeriodFilter === '10+ years' ? 'active' : ''}`}
                                onClick={() => setHoldPeriodFilter('10+ years')}
                            >
                                10+ Years ({holdPeriodCounts['10+ years']})
                            </button>
                        </div>

                        <div className="table-container">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Company</th>
                                            <th>Status</th>
                                            <th>Date of Original Investment</th>
                                            <th>Hold Period</th>
                                            <th>Invested</th>
                                            <th>Current Value</th>
                                            <th>Realized</th>
                                            <th>Gain/Loss</th>
                                            <th>Multiple</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {filteredInvestments.map((inv, idx) => {
                                            const holdPeriod = calculateHoldPeriod(inv.initial_date, inv.exit_date, inv.status);
                                            // For exited companies with no exit date, show blank hold period
                                            const showHoldPeriod = inv.status !== 'Exited' || inv.exit_date ? holdPeriod.category : '—';
                                            return (
                                            <tr key={idx}>
                                                <td style={{fontWeight: 600}}>{inv.company}</td>
                                                <td>
                                                    <span className={`status-badge status-${inv.status.toLowerCase().replace('-', '')}`}>
                                                        {inv.status}
                                                    </span>
                                                </td>
                                                <td>{formatDate(inv.initial_date)}</td>
                                                <td>{showHoldPeriod}</td>
                                                <td>{formatCurrency(inv.amount_invested)}</td>
                                                <td>{formatCurrency(inv.fmv_today)}</td>
                                                <td>{formatCurrency(inv.realized_proceeds)}</td>
                                                <td style={{color: inv.gain_loss > 0 ? '#10B981' : inv.gain_loss < 0 ? '#EF4444' : 'inherit'}}>
                                                    {formatCurrency(inv.gain_loss)}
                                                </td>
                                                <td style={{fontWeight: 600}}>{inv.multiple ? inv.multiple.toFixed(1) + 'x' : '—'}</td>
                                            </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>

                        {filteredInvestments.length === 0 && (
                            <div style={{
                                textAlign: 'center', 
                                padding: '4rem', 
                                background: 'var(--color-surface)',
                                borderRadius: '16px',
                                margin: '2rem 0',
                                border: '2px dashed var(--color-border)'
                            }}>
                                <div style={{fontSize: '3rem', marginBottom: '1rem'}}>🔍</div>
                                <div style={{fontSize: '1.125rem', fontWeight: '600', color: 'var(--color-text)', marginBottom: '0.5rem'}}>
                                    No investments found
                                </div>
                                <div style={{color: 'var(--color-text-light)', marginBottom: '1.5rem'}}>
                                    Try adjusting your search or filters
                                </div>
                                <button
                                    className="filter-btn"
                                    onClick={() => {
                                        setSearchTerm('');
                                        setStatusFilter('All');
                                        setHoldPeriodFilter('All');
                                    }}
                                    style={{
                                        background: 'var(--gradient-primary)',
                                        color: 'white',
                                        border: 'none'
                                    }}
                                >
                                    ✕ Clear All Filters
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Dashboard />, document.getElementById('root'));
    </script>
</body>
</html>
