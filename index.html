<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deborah Quazzo Angel Investment Dashboard</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
    const SHEET_ID = '1eLRjrzyxKsHgynBc8tnQQBMjgfnSUQn-TJlQK3EFJR4';
    const SHEET_NAME = 'MC Version Decemebr 2025 - THIS';
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:json&sheet=' + encodeURIComponent(SHEET_NAME);
    </script>
    
    <style>
        :root {
            --color-primary: #5B4FFF;
            --color-secondary: #FF6B9D;
            --color-accent: #00D4FF;
            --color-bg: #FAFAFF;
            --color-surface: #FFFFFF;
            --color-text: #1E1B4B;
            --color-text-light: #64748B;
            --color-border: #E9E7FF;
            --gradient-primary: linear-gradient(135deg, #5B4FFF 0%, #FF6B9D 100%);
            --shadow-lg: 0 8px 24px rgba(91, 79, 255, 0.16);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--color-bg); color: var(--color-text); line-height: 1.6; }
        .app { min-height: 100vh; }
        .header { background: var(--gradient-primary); color: white; padding: 2.5rem 2rem 4rem; }
        .header-content { max-width: 1600px; margin: 0 auto; }
        .live-badge { display: inline-block; background: rgba(255,255,255,0.2); padding: 0.5rem 1rem; border-radius: 20px; font-size: 0.875rem; margin-bottom: 1rem; font-weight: 600; }
        .live-dot { display: inline-block; width: 8px; height: 8px; background: #00FF00; border-radius: 50%; margin-right: 0.5rem; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h1 { font-family: 'Space Grotesk', sans-serif; font-size: 2.75rem; font-weight: 800; margin-bottom: 0.5rem; letter-spacing: -0.03em; }
        .subtitle { font-size: 1.125rem; opacity: 0.95; }
        .stats-overview { max-width: 1600px; margin: -2.5rem auto 0; padding: 0 2rem 2rem; position: relative; z-index: 10; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.25rem; }
        .stat-card { background: var(--color-surface); border-radius: 20px; padding: 1.5rem; box-shadow: var(--shadow-lg); border: 2px solid var(--color-border); transition: all 0.3s; }
        .stat-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: var(--gradient-primary); border-radius: 20px 20px 0 0; }
        .stat-card { position: relative; }
        .stat-icon { font-size: 1.5rem; margin-bottom: 0.5rem; display: block; }
        .stat-label { font-size: 0.75rem; font-weight: 600; color: var(--color-text-light); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
        .stat-value { font-size: 1.5rem; font-weight: 800; font-family: 'Space Grotesk', sans-serif; color: var(--color-primary); margin-bottom: 0.25rem; }
        .stat-change { font-size: 0.8125rem; color: var(--color-text-light); font-weight: 500; }
        .main-content { max-width: 1600px; margin: 0 auto; padding: 0 2rem 3rem; }
        .filters { background: var(--color-surface); border-radius: 16px; padding: 1.5rem; margin-bottom: 2rem; box-shadow: 0 2px 8px rgba(91, 79, 255, 0.08); border: 2px solid var(--color-border); display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
        .search-box { flex: 1; min-width: 250px; position: relative; }
        .search-input { width: 100%; padding: 0.875rem 1rem; border: 2px solid var(--color-border); border-radius: 12px; font-size: 0.95rem; font-family: inherit; transition: all 0.2s; }
        .search-input:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(91, 79, 255, 0.1); }
        .filter-btn { padding: 0.875rem 1.25rem; border: 2px solid var(--color-border); background: var(--color-surface); border-radius: 12px; font-size: 0.875rem; font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.2s; color: var(--color-text); }
        .filter-btn:hover { border-color: var(--color-primary); color: var(--color-primary); }
        .filter-btn.active { background: var(--gradient-primary); border-color: transparent; color: white; }
        .pdf-btn { padding: 0.875rem 1.5rem; background: var(--gradient-primary); border: none; border-radius: 12px; font-size: 0.875rem; font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.2s; color: white; }
        .pdf-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
        .table-container { background: var(--color-surface); border-radius: 16px; overflow-x: auto; box-shadow: 0 2px 8px rgba(91, 79, 255, 0.08); border: 2px solid var(--color-border); }
        table { width: 100%; border-collapse: collapse; }
        thead { background: var(--gradient-primary); color: white; position: sticky; top: 0; z-index: 10; }
        th { padding: 1rem; text-align: left; font-size: 0.8125rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
        tbody tr { border-bottom: 1px solid var(--color-border); transition: background 0.2s; }
        tbody tr:hover { background: rgba(91, 79, 255, 0.03); }
        td { padding: 1rem; font-size: 0.9375rem; }
        .status-badge { display: inline-block; padding: 0.375rem 0.75rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
        .status-active { background: rgba(91, 79, 255, 0.1); color: var(--color-primary); }
        .status-exited { background: rgba(16, 185, 129, 0.1); color: #10B981; }
        .status-wroteoff { background: rgba(239, 68, 68, 0.1); color: #EF4444; }
        .status-pending { background: rgba(251, 146, 60, 0.1); color: #FB923C; }
        .loading { text-align: center; padding: 4rem; }
        .spinner { width: 48px; height: 48px; border: 4px solid var(--color-border); border-top: 4px solid var(--color-primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
        .counter { text-align: center; padding: 0.75rem; color: var(--color-text-light); font-size: 0.9375rem; font-weight: 500; }
        .filter-badge { display: inline-block; padding: 0.25rem 0.75rem; background: var(--gradient-primary); color: white; border-radius: 12px; font-size: 0.8125rem; font-weight: 700; margin-left: 0.5rem; text-transform: uppercase; }
        .error { color: #EF4444; background: #FEE; border: 2px solid #EF4444; border-radius: 12px; margin: 2rem; padding: 2rem; text-align: center; }
        @media (max-width: 768px) { h1 { font-size: 2rem; } .stats-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div id="root"></div>
 
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
 
        function Dashboard() {
            const [investments, setInvestments] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [statusFilter, setStatusFilter] = useState('All');
            const [holdPeriodFilter, setHoldPeriodFilter] = useState('All');
 
            useEffect(() => {
                loadDataFromGoogleSheets();
                const interval = setInterval(loadDataFromGoogleSheets, 30000);
                return () => clearInterval(interval);
            }, []);
 
            const loadDataFromGoogleSheets = async () => {
                try {
                    const response = await fetch(SHEET_URL);
                    const text = await response.text();
                    const json = JSON.parse(text.substring(47).slice(0, -2));
                    const rows = json.table.rows;
                    const investments = [];
                    
                    for (let i = 4; i < rows.length; i++) {
                        const row = rows[i];
                        if (!row.c || !row.c[1] || !row.c[1].v) continue;
                        
                        const company = row.c[1].v;
                        if (!company || company.includes('Total') || company.includes('Capital') || company.includes('Residual')) continue;
                        
                        investments.push({
                            company: company,
                            status: row.c[2] ? row.c[2].v : '',
                            where_held: row.c[3] ? row.c[3].v : '',
                            amount_invested: parseFloat(row.c[4] ? row.c[4].v : 0) || 0,
                            initial_date: row.c[6] ? row.c[6].f : '',
                            exit_date: row.c[9] ? row.c[9].f : '',
                            realized_proceeds: parseFloat(row.c[10] ? row.c[10].v : 0) || 0,
                            fmv_today: parseFloat(row.c[12] ? row.c[12].v : 0) || 0,
                            gain_loss: parseFloat(row.c[13] ? row.c[13].v : 0) || 0,
                            multiple: parseFloat(row.c[14] ? row.c[14].v : 0) || 0,
                        });
                    }
                    
                    setInvestments(investments);
                    setLoading(false);
                    setError(null);
                } catch (err) {
                    console.error('Error loading data:', err);
                    setError('Unable to load data from Google Sheets. Please make sure the sheet is publicly accessible.');
                    setLoading(false);
                }
            };
 
            const calculateHoldPeriod = (initialDate, exitDate, status) => {
                if (!initialDate) return { years: 0, category: 'Unknown', label: '—' };
                
                const startDate = new Date(initialDate);
                const endDate = exitDate && status !== 'Active' ? new Date(exitDate) : new Date();
                
                const diffTime = Math.abs(endDate - startDate);
                const diffYears = diffTime / (1000 * 60 * 60 * 24 * 365.25);
                
                let category, label;
                if (diffYears < 1) {
                    category = '< 1 year';
                    label = Math.floor(diffYears * 12) + 'mo';
                } else if (diffYears < 2) {
                    category = '1-2 years';
                    label = diffYears.toFixed(1) + 'y';
                } else if (diffYears < 5) {
                    category = '3-5 years';
                    label = diffYears.toFixed(1) + 'y';
                } else if (diffYears < 10) {
                    category = '5-10 years';
                    label = diffYears.toFixed(1) + 'y';
                } else {
                    category = '10+ years';
                    label = diffYears.toFixed(1) + 'y';
                }
                
                return { years: diffYears, category: category, label: label };
            };
 
            const stats = useMemo(() => {
                if (investments.length === 0) return {};
                
                const totalInvested = investments.reduce((sum, inv) => sum + inv.amount_invested, 0);
                const currentValue = investments.reduce((sum, inv) => sum + inv.fmv_today, 0);
                const totalRealized = investments.reduce((sum, inv) => sum + inv.realized_proceeds, 0);
                const totalGainLoss = investments.reduce((sum, inv) => sum + inv.gain_loss, 0);
                
                return {
                    totalInvested: totalInvested,
                    currentValue: currentValue,
                    totalRealized: totalRealized,
                    totalGainLoss: totalGainLoss,
                    totalCompanies: investments.length,
                    activeCount: investments.filter(inv => inv.status === 'Active').length,
                    exitedCount: investments.filter(inv => inv.status === 'Exited').length,
                    avgMultiple: totalInvested > 0 ? ((currentValue + totalRealized) / totalInvested).toFixed(2) : '0.00',
                };
            }, [investments]);
 
            const statusCounts = useMemo(() => {
                let filtered = investments;
                
                if (holdPeriodFilter !== 'All') {
                    filtered = filtered.filter(inv => {
                        const hp = calculateHoldPeriod(inv.initial_date, inv.exit_date, inv.status);
                        return hp.category === holdPeriodFilter;
                    });
                }
                
                if (searchTerm) {
                    filtered = filtered.filter(inv =>
                        inv.company.toLowerCase().indexOf(searchTerm.toLowerCase()) !== -1
                    );
                }
                
                return {
                    all: filtered.length,
                    active: filtered.filter(inv => inv.status === 'Active').length,
                    exited: filtered.filter(inv => inv.status === 'Exited').length,
                    wroteOff: filtered.filter(inv => inv.status === 'Wrote-Off').length,
                    pending: filtered.filter(inv => inv.status === 'Pending').length
                };
            }, [investments, holdPeriodFilter, searchTerm]);
 
            const filteredInvestments = useMemo(() => {
                let filtered = investments;
 
                if (statusFilter !== 'All') {
                    filtered = filtered.filter(inv => inv.status === statusFilter);
                }
 
                if (holdPeriodFilter !== 'All') {
                    filtered = filtered.filter(inv => {
                        const hp = calculateHoldPeriod(inv.initial_date, inv.exit_date, inv.status);
                        return hp.category === holdPeriodFilter;
                    });
                }
 
                if (searchTerm) {
                    filtered = filtered.filter(inv =>
                        inv.company.toLowerCase().indexOf(searchTerm.toLowerCase()) !== -1
                    );
                }
 
                return filtered;
            }, [investments, searchTerm, statusFilter, holdPeriodFilter]);
 
            const formatCurrency = (amount) => {
                return new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: 'USD',
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 0
                }).format(amount || 0);
            };
 
            const formatDate = (date) => {
                if (!date) return '—';
                return new Date(date).toLocaleDateString('en-US', { year: 'numeric', month: 'short' });
            };
 
            const getTodayDate = () => {
                return new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            };
 
            const exportToPDF = () => {
                const jsPDF = window.jspdf.jsPDF;
                const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'letter' });
 
                doc.setFontSize(16);
                doc.setFont(undefined, 'bold');
                doc.text('Deborah Quazzo Angel Investment Portfolio', 40, 40);
                
                doc.setFontSize(10);
                doc.setFont(undefined, 'normal');
                const filterText = statusFilter !== 'All' ? ('Status: ' + statusFilter) : 'All Investments';
                const periodText = holdPeriodFilter !== 'All' ? (' - Hold Period: ' + holdPeriodFilter) : '';
                doc.text(filterText + periodText + ' - As of ' + getTodayDate(), 40, 55);
 
                const tableData = filteredInvestments.map(inv => {
                    const holdPeriod = calculateHoldPeriod(inv.initial_date, inv.exit_date, inv.status);
                    const showHoldPeriod = inv.status !== 'Exited' || inv.exit_date ? holdPeriod.category : '—';
                    
                    return [
                        inv.company,
                        inv.status,
                        formatDate(inv.initial_date),
                        showHoldPeriod,
                        formatCurrency(inv.amount_invested),
                        formatCurrency(inv.fmv_today),
                        formatCurrency(inv.realized_proceeds),
                        formatCurrency(inv.gain_loss),
                        inv.multiple ? inv.multiple.toFixed(1) + 'x' : '—'
                    ];
                });
 
                doc.autoTable({
                    head: [['Company', 'Status', 'Date', 'Hold Period', 'Invested', 'Current Value', 'Realized', 'Gain/Loss', 'Multiple']],
                    body: tableData,
                    startY: 70,
                    styles: { fontSize: 9, cellPadding: 4 },
                    headStyles: { fillColor: [91, 79, 255], textColor: 255, fontSize: 9, fontStyle: 'bold' },
                    margin: { top: 70, left: 40, right: 40 }
                });
 
                const statusPart = statusFilter !== 'All' ? ('_' + statusFilter) : '';
                const periodPart = holdPeriodFilter !== 'All' ? ('_' + holdPeriodFilter.replace(/[<>]/g, '').replace(/\s+/g, '-')) : '';
                const filename = 'Quazzo_Portfolio' + statusPart + periodPart + '_' + new Date().toISOString().split('T')[0] + '.pdf';
                
                doc.save(filename);
            };
 
            const exportToCSV = () => {
                const headers = ['Company', 'Status', 'Date of Investment', 'Hold Period', 'Amount Invested', 'Current Value', 'Realized Proceeds', 'Gain/Loss', 'Multiple'];
                
                const rows = filteredInvestments.map(inv => {
                    const holdPeriod = calculateHoldPeriod(inv.initial_date, inv.exit_date, inv.status);
                    const showHoldPeriod = inv.status !== 'Exited' || inv.exit_date ? holdPeriod.category : '';
                    
                    return [
                        inv.company,
                        inv.status,
                        inv.initial_date || '',
                        showHoldPeriod,
                        inv.amount_invested || 0,
                        inv.fmv_today || 0,
                        inv.realized_proceeds || 0,
                        inv.gain_loss || 0,
                        inv.multiple ? inv.multiple.toFixed(1) : ''
                    ];
                });
 
                const csvContent = [headers.join(',')].concat(
                    rows.map(row => row.map(cell => {
                        const cellStr = String(cell);
                        if (cellStr.indexOf(',') !== -1 || cellStr.indexOf('"') !== -1 || cellStr.indexOf('\n') !== -1) {
                            return '"' + cellStr.replace(/"/g, '""') + '"';
                        }
                        return cellStr;
                    }).join(','))
                ).join('\n');
 
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                const url = URL.createObjectURL(blob);
                
                const statusPart = statusFilter !== 'All' ? ('_' + statusFilter) : '';
                const periodPart = holdPeriodFilter !== 'All' ? ('_' + holdPeriodFilter.replace(/[<>]/g, '').replace(/\s+/g, '-')) : '';
                const filename = 'Quazzo_Portfolio' + statusPart + periodPart + '_' + new Date().toISOString().split('T')[0] + '.csv';
                
                link.setAttribute('href', url);
                link.setAttribute('download', filename);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };
 
            if (loading) {
                return (
                    <div className="loading">
                        <div className="spinner"></div>
                        <div style={{fontSize: '1.125rem', fontWeight: '600'}}>Loading portfolio data...</div>
                    </div>
                );
            }
 
            if (error) {
                return <div className="error">Error: {error}</div>;
            }
 
            return (
                <div className="app">
                    <div className="header">
                        <div className="header-content">
                            <div className="live-badge">
                                <span className="live-dot"></span>
                                LIVE - Auto-updates
                            </div>
                            <h1>Deborah Quazzo Angel Investment Summary</h1>
                            <div className="subtitle">
                                Complete Portfolio • As of {getTodayDate()} • {stats.totalCompanies} Investments
                            </div>
                        </div>
                    </div>
 
                    <div className="stats-overview">
                        <div className="stats-grid">
                            <div className="stat-card">
                                <span className="stat-icon">💰</span>
                                <div className="stat-label">Total Invested</div>
                                <div className="stat-value">{formatCurrency(stats.totalInvested)}</div>
                                <div className="stat-change">{stats.totalCompanies} companies</div>
                            </div>
                            <div className="stat-card">
                                <span className="stat-icon">🎉</span>
                                <div className="stat-label">Realized Proceeds</div>
                                <div className="stat-value">{formatCurrency(stats.totalRealized)}</div>
                                <div className="stat-change">Cash returned</div>
                            </div>
                            <div className="stat-card">
                                <span className="stat-icon">📈</span>
                                <div className="stat-label">Residual Value</div>
                                <div className="stat-value">{formatCurrency(stats.currentValue)}</div>
                                <div className="stat-change">Current holdings</div>
                            </div>
                            <div className="stat-card">
                                <span className="stat-icon">✨</span>
                                <div className="stat-label">Total Gain/Loss</div>
                                <div className="stat-value">{formatCurrency(stats.totalGainLoss)}</div>
                                <div className="stat-change">{stats.avgMultiple}x TVPI</div>
                            </div>
                            <div className="stat-card">
                                <span className="stat-icon">📊</span>
                                <div className="stat-label">Active Holdings</div>
                                <div className="stat-value">{stats.activeCount}</div>
                                <div className="stat-change">Current investments</div>
                            </div>
                            <div className="stat-card">
                                <span className="stat-icon">🚪</span>
                                <div className="stat-label">Exits</div>
                                <div className="stat-value">{stats.exitedCount}</div>
                                <div className="stat-change">Successful exits</div>
                            </div>
                        </div>
                    </div>
 
                    <div className="main-content">
                        <div className="filters">
                            <div className="search-box">
                                <input
                                    type="text"
                                    className="search-input"
                                    placeholder="Search companies..."
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                />
                            </div>
                            <button className={statusFilter === 'All' ? 'filter-btn active' : 'filter-btn'} onClick={() => setStatusFilter('All')}>
                                All ({statusCounts.all})
                            </button>
                            <button className={statusFilter === 'Active' ? 'filter-btn active' : 'filter-btn'} onClick={() => setStatusFilter('Active')}>
                                Active ({statusCounts.active})
                            </button>
                            <button className={statusFilter === 'Pending' ? 'filter-btn active' : 'filter-btn'} onClick={() => setStatusFilter('Pending')}>
                                Pending ({statusCounts.pending})
                            </button>
                            <button className={statusFilter === 'Exited' ? 'filter-btn active' : 'filter-btn'} onClick={() => setStatusFilter('Exited')}>
                                Exited ({statusCounts.exited})
                            </button>
                            <button className={statusFilter === 'Wrote-Off' ? 'filter-btn active' : 'filter-btn'} onClick={() => setStatusFilter('Wrote-Off')}>
                                Written Off ({statusCounts.wroteOff})
                            </button>
                            <button className="pdf-btn" onClick={exportToCSV}>
                                📊 Download CSV
                            </button>
                            <button className="pdf-btn" onClick={exportToPDF}>
                                📄 Download PDF
                            </button>
                        </div>
 
                        <div className="counter">
                            Showing {filteredInvestments.length} of {stats.totalCompanies} investments
                        </div>
 
                        <div className="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Company</th>
                                        <th>Status</th>
                                        <th>Date of Investment</th>
                                        <th>Hold Period</th>
                                        <th>Invested</th>
                                        <th>Current Value</th>
                                        <th>Realized</th>
                                        <th>Gain/Loss</th>
                                        <th>Multiple</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredInvestments.map((inv, idx) => {
                                        const holdPeriod = calculateHoldPeriod(inv.initial_date, inv.exit_date, inv.status);
                                        const showHoldPeriod = inv.status !== 'Exited' || inv.exit_date ? holdPeriod.category : '—';
                                        const statusClass = 'status-' + inv.status.toLowerCase().replace('-', '');
                                        return (
                                        <tr key={idx}>
                                            <td style={{fontWeight: '600'}}>{inv.company}</td>
                                            <td><span className={'status-badge ' + statusClass}>{inv.status}</span></td>
                                            <td>{formatDate(inv.initial_date)}</td>
                                            <td>{showHoldPeriod}</td>
                                            <td>{formatCurrency(inv.amount_invested)}</td>
                                            <td>{formatCurrency(inv.fmv_today)}</td>
                                            <td>{formatCurrency(inv.realized_proceeds)}</td>
                                            <td style={{color: inv.gain_loss > 0 ? '#10B981' : inv.gain_loss < 0 ? '#EF4444' : 'inherit'}}>{formatCurrency(inv.gain_loss)}</td>
                                            <td style={{fontWeight: '600'}}>{inv.multiple ? inv.multiple.toFixed(1) + 'x' : '—'}</td>
                                        </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
 
                        {filteredInvestments.length === 0 && (
                            <div style={{textAlign: 'center', padding: '4rem', background: 'var(--color-surface)', borderRadius: '16px', margin: '2rem 0', border: '2px dashed var(--color-border)'}}>
                                <div style={{fontSize: '3rem', marginBottom: '1rem'}}>🔍</div>
                                <div style={{fontSize: '1.125rem', fontWeight: '600', color: 'var(--color-text)', marginBottom: '0.5rem'}}>
                                    No investments found
                                </div>
                                <button className="filter-btn" onClick={() => { setSearchTerm(''); setStatusFilter('All'); setHoldPeriodFilter('All'); }} style={{background: 'var(--gradient-primary)', color: 'white', border: 'none', marginTop: '1rem'}}>
                                    Clear filters
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }
 
        ReactDOM.render(<Dashboard />, document.getElementById('root'));
    </script>
</body>
</html>
