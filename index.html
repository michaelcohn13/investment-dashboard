<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deborah Quazzo Angel Investment Dashboard - Live</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
    // Google Sheets Configuration
    const SHEET_ID = '1eLRjrzyxKsHgynBc8tnQQBMjgfnSUQn-TJlQK3EFJR4';
    const SHEET_NAME = 'MC Version Decemebr 2025 - THIS'; // We'll update this with the correct name
    const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
    </script>
    
    <style>
        :root {
            --color-primary: #5B4FFF;
            --color-secondary: #FF6B9D;
            --color-accent: #00D4FF;
            --color-purple-light: #A78BFA;
            --color-pink-light: #FFB3D9;
            --color-blue-dark: #3730A3;
            --color-bg: #FAFAFF;
            --color-surface: #FFFFFF;
            --color-text: #1E1B4B;
            --color-text-light: #64748B;
            --color-border: #E9E7FF;
            --gradient-primary: linear-gradient(135deg, #5B4FFF 0%, #FF6B9D 100%);
            --gradient-accent: linear-gradient(135deg, #00D4FF 0%, #A78BFA 100%);
            --shadow-sm: 0 2px 8px rgba(91, 79, 255, 0.08);
            --shadow-md: 0 4px 16px rgba(91, 79, 255, 0.12);
            --shadow-lg: 0 8px 24px rgba(91, 79, 255, 0.16);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .app { min-height: 100vh; }

        /* Header */
        .header {
            background: var(--gradient-primary);
            color: white;
            padding: 2.5rem 2rem 4rem;
            position: relative;
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.75rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -0.03em;
        }

        .subtitle { font-size: 1.125rem; opacity: 0.95; }

        .live-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #00FF00;
            border-radius: 50%;
            margin-right: 0.5rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Stats Overview */
        .stats-overview {
            max-width: 1600px;
            margin: -2.5rem auto 0;
            padding: 0 2rem 2rem;
            position: relative;
            z-index: 10;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.25rem;
        }

        .stat-card {
            background: var(--color-surface);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: var(--shadow-lg);
            border: 2px solid var(--color-border);
            transition: all 0.3s;
            position: relative;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--gradient-primary);
        }

        .stat-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-xl); }

        .stat-icon { font-size: 2rem; margin-bottom: 0.5rem; display: block; }

        .stat-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--color-text-light);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            font-family: 'Space Grotesk', sans-serif;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.25rem;
        }

        .loading {
            text-align: center;
            padding: 4rem;
            font-size: 1.25rem;
            color: var(--color-text-light);
        }

        .error {
            background: #FEE;
            border: 2px solid #F00;
            padding: 2rem;
            margin: 2rem;
            border-radius: 12px;
            color: #C00;
        }

        .main-content {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 2rem 3rem;
        }

        .table-container {
            background: var(--color-surface);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 2px solid var(--color-border);
            margin-top: 2rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: var(--gradient-primary);
            color: white;
        }

        th {
            padding: 1rem;
            text-align: left;
            font-size: 0.8125rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        tbody tr {
            border-bottom: 1px solid var(--color-border);
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: rgba(91, 79, 255, 0.03);
        }

        td {
            padding: 1rem;
            font-size: 0.9375rem;
        }

        .status-badge {
            display: inline-block;
            padding: 0.375rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-active {
            background: rgba(91, 79, 255, 0.1);
            color: var(--color-primary);
        }

        .status-exited {
            background: rgba(16, 185, 129, 0.1);
            color: #10B981;
        }

        .status-wrote-off {
            background: rgba(239, 68, 68, 0.1);
            color: #EF4444;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function Dashboard() {
            const [investments, setInvestments] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [lastUpdate, setLastUpdate] = useState(null);

            useEffect(() => {
                loadDataFromGoogleSheets();
                // Auto-refresh every 30 seconds
                const interval = setInterval(loadDataFromGoogleSheets, 30000);
                return () => clearInterval(interval);
            }, []);

            const loadDataFromGoogleSheets = async () => {
                try {
                    const response = await fetch(SHEET_URL);
                    const text = await response.text();
                    
                    // Google Sheets returns JSONP, need to extract JSON
                    const json = JSON.parse(text.substring(47).slice(0, -2));
                    
                    const rows = json.table.rows;
                    const investments = [];
                    
                    // Skip first 4 rows (headers are in row 4, 0-indexed as row 3)
                    for (let i = 4; i < rows.length; i++) {
                        const row = rows[i];
                        if (!row.c || !row.c[1] || !row.c[1].v) continue;
                        
                        const company = row.c[1]?.v;
                        if (!company || company.includes('Total') || company.includes('Capital') || company.includes('Residual')) continue;
                        
                        const investment = {
                            company: company,
                            status: row.c[2]?.v || '',
                            where_held: row.c[3]?.v || '',
                            amount_invested: parseFloat(row.c[4]?.v) || 0,
                            ceo: row.c[5]?.v || '',
                            initial_date: row.c[6]?.f || '',
                            shares: parseFloat(row.c[7]?.v) || null,
                            pps: parseFloat(row.c[8]?.v) || null,
                            exit_date: row.c[9]?.f || '',
                            realized_proceeds: parseFloat(row.c[10]?.v) || 0,
                            coc_return: parseFloat(row.c[11]?.v) || 0,
                            fmv_today: parseFloat(row.c[12]?.v) || 0,
                            gain_loss: parseFloat(row.c[13]?.v) || 0,
                            multiple: parseFloat(row.c[14]?.v) || 0,
                        };
                        
                        investments.push(investment);
                    }
                    
                    setInvestments(investments);
                    setLastUpdate(new Date());
                    setLoading(false);
                    setError(null);
                } catch (err) {
                    console.error('Error loading data:', err);
                    setError('Unable to load data from Google Sheets. Please make sure the sheet is publicly accessible.');
                    setLoading(false);
                }
            };

            const stats = useMemo(() => {
                if (investments.length === 0) return {};
                
                const active = investments.filter(inv => inv.status === 'Active');
                const exited = investments.filter(inv => inv.status === 'Exited');
                const wroteOff = investments.filter(inv => inv.status === 'Wrote-Off');
                
                const totalInvested = investments.reduce((sum, inv) => sum + inv.amount_invested, 0);
                const currentValue = investments.reduce((sum, inv) => sum + inv.fmv_today, 0);
                const totalRealized = investments.reduce((sum, inv) => sum + inv.realized_proceeds, 0);
                const totalGainLoss = investments.reduce((sum, inv) => sum + inv.gain_loss, 0);
                
                return {
                    totalInvested,
                    currentValue,
                    totalRealized,
                    totalGainLoss,
                    totalCompanies: investments.length,
                    activeCount: active.length,
                    exitedCount: exited.length,
                    wroteOffCount: wroteOff.length,
                    avgMultiple: totalInvested > 0 ? ((currentValue + totalRealized) / totalInvested).toFixed(2) : '0.00'
                };
            }, [investments]);

            const formatCurrency = (amount) => {
                return new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: 'USD',
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 0
                }).format(amount || 0);
            };

            if (loading) {
                return <div className="loading">🔄 Loading portfolio data from Google Sheets...</div>;
            }

            if (error) {
                return (
                    <div className="error">
                        <h2>⚠️ Error Loading Data</h2>
                        <p>{error}</p>
                        <h3>Setup Required:</h3>
                        <ol>
                            <li>Open your Google Sheet</li>
                            <li>Click Share → Change to "Anyone with the link"</li>
                            <li>Set permission to "Viewer"</li>
                            <li>Refresh this page</li>
                        </ol>
                    </div>
                );
            }

            return (
                <div className="app">
                    <div className="header">
                        <div className="header-content">
                            <div className="live-badge">
                                <span className="live-dot"></span>
                                LIVE - Auto-updates from Google Sheets
                            </div>
                            <h1>Deborah Quazzo Angel Investment Dashboard</h1>
                            <div className="subtitle">
                                Complete Portfolio • As of January 31, 2026 • {stats.totalCompanies} Investments
                                {lastUpdate && ` • Last updated: ${lastUpdate.toLocaleTimeString()}`}
                            </div>
                        </div>
                    </div>

                    <div className="stats-overview">
                        <div className="stats-grid">
                            <div className="stat-card">
                                <span className="stat-icon">💰</span>
                                <div className="stat-label">Total Invested</div>
                                <div className="stat-value">{formatCurrency(stats.totalInvested)}</div>
                                <div className="stat-change">{stats.totalCompanies} companies</div>
                            </div>
                            <div className="stat-card">
                                <span className="stat-icon">📈</span>
                                <div className="stat-label">Current Value</div>
                                <div className="stat-value">{formatCurrency(stats.currentValue)}</div>
                                <div className="stat-change">{stats.activeCount} active</div>
                            </div>
                            <div className="stat-card">
                                <span className="stat-icon">🎉</span>
                                <div className="stat-label">Realized Proceeds</div>
                                <div className="stat-value">{formatCurrency(stats.totalRealized)}</div>
                                <div className="stat-change">{stats.exitedCount} exited</div>
                            </div>
                            <div className="stat-card">
                                <span className="stat-icon">✨</span>
                                <div className="stat-label">Total Gain/Loss</div>
                                <div className="stat-value">{formatCurrency(stats.totalGainLoss)}</div>
                                <div className="stat-change">{stats.avgMultiple}x TVPI</div>
                            </div>
                        </div>
                    </div>

                    <div className="main-content">
                        <div className="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Company</th>
                                        <th>Status</th>
                                        <th>Invested</th>
                                        <th>Current Value</th>
                                        <th>Realized</th>
                                        <th>Gain/Loss</th>
                                        <th>Multiple</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {investments.slice(0, 20).map((inv, idx) => (
                                        <tr key={idx}>
                                            <td style={{fontWeight: 600}}>{inv.company}</td>
                                            <td>
                                                <span className={`status-badge status-${inv.status.toLowerCase().replace('-', '')}`}>
                                                    {inv.status}
                                                </span>
                                            </td>
                                            <td>{formatCurrency(inv.amount_invested)}</td>
                                            <td>{formatCurrency(inv.fmv_today)}</td>
                                            <td>{formatCurrency(inv.realized_proceeds)}</td>
                                            <td style={{color: inv.gain_loss > 0 ? '#10B981' : inv.gain_loss < 0 ? '#EF4444' : 'inherit'}}>
                                                {formatCurrency(inv.gain_loss)}
                                            </td>
                                            <td style={{fontWeight: 600}}>{inv.multiple ? inv.multiple.toFixed(2) + 'x' : '—'}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                        <p style={{marginTop: '1rem', color: 'var(--color-text-light)', textAlign: 'center'}}>
                            Showing top 20 investments • Full dashboard with all features coming soon
                        </p>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Dashboard />, document.getElementById('root'));
    </script>
</body>
</html>
